# Configuración de Supabase CLI para el proyecto Urbea.
# Doc: https://supabase.com/docs/guides/cli/config
# Vincular el proyecto remoto:  supabase link --project-ref mvpvqmyhrrkwbnpctpuq

project_id = "urbea-app"

[db]
# Versión mayor de Postgres del proyecto remoto (urbea-app corre Postgres 17).
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.migrations]
schema_paths = []

[auth]
# Cierra /auth/v1/signup a anon (#93.4): el único alta libre queda por la EF
# register (usa la API admin, no /signup). No afecta redeem-invitation
# (authAdmin.createUser) ni seed.sql (INSERT directo a auth.users).
enable_signup = false
# Deep link de la app (72.3): destino del correo de verificación / reset
# password que abre `urbea://verify-email#access_token=...` (ver
# mobile/src/features/auth/deep-link-session.ts). Sin esto GoTrue rechaza el
# redirect_to y cae al Site URL por default.
additional_redirect_urls = ["urbea://*"]

[auth.email]
# Paridad LOCAL del flujo de verificación real de email (72.3): con
# enable_confirmations=true, admin.createUser (EF register, email_confirm:
# false) deja al usuario sin confirmar y GoTrue envía el correo vía Mailpit
# ([inbucket], ya default local en localhost:54324) al llamar auth.resend
# desde el cliente. El REMOTO se configura aparte con Resend como SMTP
# custom — ver docs/TODO-pendientes.md (prereq externo, sigue bloqueante).
enable_confirmations = true

# ── Edge Functions: paridad con cómo se despliegan en el REMOTO ───────────────
# Sin estas secciones el stack local le exige JWT a TODAS las funciones, aunque
# en producción estas dos se despliegan con --no-verify-jwt. La divergencia no
# se nota hasta que algo falla en local con un 401 que en remoto no ocurre
# (así se descubrió: el webhook de Stream simulado contra local, 2026-08-21).
[functions.stream-webhook]
# Webhook público de Cloudflare Stream: lo llama Cloudflare server-to-server,
# sin JWT de Supabase. La firma HMAC del header Webhook-Signature es la única
# barrera de autenticación (ver functions/stream-webhook/handler.ts).
verify_jwt = false

[functions.register]
# Alta libre: quien llama todavía no tiene sesión, por definición.
verify_jwt = false
